[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ProjectRevisit"
version = "0.1.0"
description = "Local project knowledge retrieval and interview review"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.45,<2", "langchain-chroma>=0.2.5,<2",
  "langchain-text-splitters>=0.3.8,<2", "openai>=1.80,<3",
  "keyring>=25,<26", "platformdirs>=4,<5", "filelock>=3.18,<4", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", ".tools", ".venv", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

